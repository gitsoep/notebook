services:
  notebook:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - notebook-data:/app/data
    restart: unless-stopped

volumes:
  notebook-data:
